name: E2E Playwright Tests

on:
  push:
    branches: [ main, master, fixes ]
  pull_request:
    branches: [ main, master, fixes ]

jobs:
  e2e-tests:
    name: Run Playwright E2E Tests on Remote Server
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        # Write the private key to id_ed25519 file
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add server to known hosts
        ssh-keyscan -H ${{ secrets.SSH_TEST_SERVER }} >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        # Start ssh-agent
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_ed25519
        echo "SSH key configured successfully"

    - name: Run E2E Tests on Remote Server
      env:
        SSH_USER: ${{ secrets.SSH_TEST_USER }}
        SSH_HOST: ${{ secrets.SSH_TEST_SERVER }}
      run: |
        echo "Connecting to remote server ${SSH_HOST} as ${SSH_USER}..."
        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${SSH_USER}@${SSH_HOST} << 'EOF'
          set -e

          # Navigate to project directory
          cd ~/minimal-demo || exit 1

          # Pull latest changes from origin
          git fetch origin
          git reset --hard origin/fixes

          # Ensure app is running
          if ! curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8012 | grep -q "200"; then
            echo "Starting application..."
            # Kill any existing uvicorn process
            pkill -f "uvicorn src.app:app" || true
            sleep 2
            # Start app in background
            nohup .venv/bin/uvicorn src.app:app --host 127.0.0.1 --port 8012 > app.log 2>&1 &
            sleep 3
          fi

          # Check if app is accessible
          echo "Checking application status..."
          curl -s http://127.0.0.1:8012 | head -20

          # Install Node.js dependencies if needed
          if [ ! -d "node_modules" ]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

          # Install Playwright browsers if needed
          if [ ! -d "$HOME/.cache/ms-playwright" ]; then
            echo "Installing Playwright browsers..."
            npx playwright install chromium
          fi

          # Copy test files from GitHub runner to ensure latest tests are used
          echo "Running E2E tests against http://${SSH_HOST}:8012"
          TEST_URL=http://${SSH_HOST}:8012 npm test

          # Copy test results back for artifact upload
          echo "Tests completed!"
        EOF

    - name: Fetch test results from remote server
      if: always()
      env:
        SSH_USER: ${{ secrets.SSH_TEST_USER }}
        SSH_HOST: ${{ secrets.SSH_TEST_SERVER }}
      run: |
        # Create local directories
        mkdir -p report test-results
        # Copy test results from remote server
        scp -i ~/.ssh/id_ed25519 -r ${SSH_USER}@${SSH_HOST}:~/minimal-demo/report/* report/ 2>/dev/null || true
        scp -i ~/.ssh/id_ed25519 -r ${SSH_USER}@${SSH_HOST}:~/minimal-demo/test-results/* test-results/ 2>/dev/null || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          report/
          test-results/
        retention-days: 30
